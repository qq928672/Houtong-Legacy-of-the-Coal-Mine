<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>猴硐礦坑大冒險</title>
<style>
  @font-face {
    font-display: swap;
  }

  :root {
    --lamp-glow: #ffcf6b;
    --ember: #ff8a3d;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
  }

  .entrance {
    position: relative;
    width: 100%;
    height: 100vh;
    background-image:
      linear-gradient(to bottom, rgba(10, 8, 6, 0.35) 0%, rgba(10, 8, 6, 0.15) 35%, rgba(8, 6, 4, 0.55) 68%, rgba(4, 3, 2, 0.92) 100%),
      url("遊戲入口/10996645-8da9-4d5b-91b6-e307342bd4b0%20(1).jfif");
    background-size: cover;
    background-position: center 40%;
    background-repeat: no-repeat;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #f4e6c8;
  }

  /* 飄動煤塵微光 */
  .spark {
    position: absolute;
    border-radius: 50%;
    background: var(--lamp-glow);
    box-shadow: 0 0 6px 2px var(--lamp-glow);
    opacity: 0;
    animation: rise 6s linear infinite;
  }
  @keyframes rise {
    0%   { transform: translateY(0) translateX(0); opacity: 0; }
    10%  { opacity: 0.9; }
    100% { transform: translateY(-30vh) translateX(10px); opacity: 0; }
  }

  .title-wrap {
    text-align: center;
    margin-bottom: 6vh;
    animation: fadeDown 1.1s ease-out;
  }
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .subtitle {
    letter-spacing: 0.5em;
    font-size: clamp(0.75rem, 1.6vw, 1rem);
    color: #d9b97a;
    margin: 0 0 0.6rem;
    text-shadow: 0 0 10px rgba(0,0,0,0.8);
  }

  .title {
    margin: 0;
    font-size: clamp(2.4rem, 7vw, 5rem);
    font-weight: 900;
    letter-spacing: 0.08em;
    color: #fff3d6;
    text-shadow:
      0 0 12px rgba(255, 207, 107, 0.65),
      0 0 28px rgba(255, 138, 61, 0.45),
      0 4px 10px rgba(0, 0, 0, 0.85);
  }

  .tagline {
    margin: 0.8rem 0 0;
    font-size: clamp(0.85rem, 2vw, 1.15rem);
    color: #efd9ad;
    text-shadow: 0 2px 6px rgba(0,0,0,0.9);
  }

  .menu {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
    animation: fadeUp 1.1s ease-out 0.2s both;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .btn {
    position: relative;
    padding: 0.85rem 3.2rem;
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: 0.3em;
    color: #2a1a0a;
    background: linear-gradient(180deg, #ffe19a 0%, var(--lamp-glow) 45%, var(--ember) 100%);
    border: 1px solid #7a4c1c;
    border-radius: 4px;
    cursor: pointer;
    box-shadow: 0 0 18px rgba(255, 176, 66, 0.55), inset 0 1px 0 rgba(255,255,255,0.6);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:hover {
    transform: translateY(-2px) scale(1.03);
    box-shadow: 0 0 28px rgba(255, 176, 66, 0.85), inset 0 1px 0 rgba(255,255,255,0.6);
  }
  .btn:active { transform: translateY(0) scale(0.99); }

  .btn.secondary {
    padding: 0.6rem 2.4rem;
    font-size: 0.9rem;
    color: #f4e6c8;
    background: rgba(20, 14, 8, 0.55);
    border: 1px solid rgba(217, 185, 122, 0.6);
    box-shadow: none;
  }
  .btn.secondary:hover {
    background: rgba(40, 28, 14, 0.75);
    box-shadow: 0 0 14px rgba(217, 185, 122, 0.4);
    transform: translateY(-1px);
  }

  .vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    box-shadow: inset 0 0 18vw 4vw rgba(0,0,0,0.75);
  }
</style>
</head>
<body>
  <div class="entrance" id="entrance">
    <div class="vignette"></div>

    <div class="title-wrap">
      <p class="subtitle">COAL MINE ADVENTURE</p>
      <h1 class="title">猴硐礦坑大冒險</h1>
      <p class="tagline">戴上頭燈，跟著礦工貓走訪礦坑各站點 ⛏</p>
    </div>

    <nav class="menu">
      <button class="btn secondary" id="startBtn">開始探索</button>
    </nav>
  </div>

  <script>
    // 隨機產生飄浮微光
    const entrance = document.getElementById('entrance');
    for (let i = 0; i < 22; i++) {
      const s = document.createElement('div');
      s.className = 'spark';
      const size = 2 + Math.random() * 3;
      s.style.width = size + 'px';
      s.style.height = size + 'px';
      s.style.left = (Math.random() * 100) + 'vw';
      s.style.bottom = (Math.random() * 15) + 'vh';
      s.style.animationDelay = (Math.random() * 6) + 's';
      s.style.animationDuration = (4 + Math.random() * 4) + 's';
      entrance.appendChild(s);
    }

    document.getElementById('startBtn').addEventListener('click', () => {
      window.location.href = 'story.html';
    });
  </script>
</body>
</html>
